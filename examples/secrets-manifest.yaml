# secrets-manifest.yaml — committable, credential-free routing for BWS injection.
#
# Lives at the root of a project that consumes secrets. It tells an agent (or a
# human) WHICH Bitwarden project to inject and WHAT env var each secret becomes.
# It contains NO secret values — only UUIDs and env-var names.
#
# Convention:
#   - project tiers (prod / stage / nonprod) map to separate BWS projects.
#   - the SAME secret name across tiers (e.g. APP_DB_DSN) lets one script run
#     against any tier just by swapping the project UUID.

injections:
  app-db-prod:
    project: prod
    env: APP_DB_DSN          # becomes $APP_DB_DSN inside the injected subprocess
  app-db-stage:
    project: stage
    env: APP_DB_DSN          # same env name, different tier value
  stripe-prod:
    project: prod
    env: STRIPE_API_KEY

projects:
  prod:  "00000000-0000-0000-0000-000000000000"   # ← your BWS project UUID
  stage: "11111111-1111-1111-1111-111111111111"
