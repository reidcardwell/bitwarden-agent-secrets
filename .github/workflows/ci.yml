name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck skills/bitwarden/scripts/* skills/bitwarden/examples/*.sh install.sh tests/*.sh

      - name: syntax check
        run: |
          for f in skills/bitwarden/scripts/* skills/bitwarden/examples/*.sh install.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: tests
        run: |
          python3 -m pip install --quiet pytest
          tests/run.sh

      - name: audit (expects no FAIL on a clean checkout)
        run: |
          # Pre-install: the ~/.local/bin copies are absent, so (a) reports FAIL
          # by design. We assert the audit RUNS and only the install checks fail.
          out="$(skills/bitwarden/scripts/bws-audit.sh . || true)"
          echo "$out"
          echo "$out" | grep -q 'AUDIT SUMMARY' || { echo 'audit did not complete'; exit 1; }
          if echo "$out" | grep -E '^\[FAIL\]' | grep -viE 'does not exist|stale|symlink|not executable'; then
            echo 'Unexpected non-install FAIL in audit'; exit 1
          fi
